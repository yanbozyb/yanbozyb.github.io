<div id="flex-container" style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-top: 1.6rem;">
    <img src="{{ .Get "src" }}" alt="{{ .Get "alt" }}" style="max-width: 100%; width: 12rem; flex: 0 1 auto; margin-right: 2.5rem;">
    {{ $contentSlices := split .Inner "*" }}
    <div id="second-column" style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1 1 auto;">
        <span style="font-size: 1.6rem; display: block; margin-bottom: 0; font-weight: 500;">Yanbo Zhou</span>
        {{ index $contentSlices 0 | markdownify }}
    </div>
    <div id="third-column" style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1 1 auto; margin-left: 2.5rem;">
        <span style="font-weight: 500;">Research Interests:</span>
        {{ index $contentSlices 1 | markdownify }}
    </div>
</div>

<script>
function adjustMargin() {
    const container = document.getElementById('flex-container');
    const secondColumn = document.getElementById('second-column');
    const thirdColumn = document.getElementById('third-column');

    // Adjust third column margin
    if (thirdColumn.offsetTop > container.offsetTop) {
        thirdColumn.style.marginLeft = '0';
    } else {
        thirdColumn.style.marginLeft = '2.5rem';
    }

    // Adjust second column margin-top if it wraps
    if (secondColumn.offsetTop > container.offsetTop) {
        secondColumn.style.marginTop = '1rem';  // or any desired margin value
    } else {
        secondColumn.style.marginTop = '0';
    }
}

window.addEventListener('resize', adjustMargin);
window.addEventListener('load', adjustMargin);
</script>
