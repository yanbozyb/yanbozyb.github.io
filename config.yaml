baseURL: 'https://yanbozyb.github.io/'
#title: Yanbo Zhou
author: Yanbo Zhou
languageCode: en-us
pygmentsCodeFences: true
enableRobotsTXT: true
theme: hugo-flex
publishDir: docs
markup:
  goldmark:
    renderer:
      unsafe: true
disableKinds:
  - taxonomy
  - term

permalinks:
  posts: '/:filename/'
  pages: '/:filename/'

params:
  #color: "#005587"
  color: "#000000"
  width: 63rem
  description:  Yanbo Zhou is a Ph.D. candidate in Computer Science at UC San Diego working on memory and storage systems for cloud infrastructure.
  #footer: Except where otherwise noted, content on this site is licensed under a
  #  <a href="http://creativecommons.org/licenses/by/4.0/" rel="license">
  #  Creative Commons Attribution 4.0 International License</a>.
  footer: Updated in {{DATE_SHORT}}.
  rss: >-
    To subscribe to this RSS feed, copy the address in the address bar and paste
    it into your favorite feed reader.
  divider: '\2015\2015' # Set to false to remove divider below posts on homepage
  schema: true
  opengraph: true
  twittercards: true
  summaries: false
  person:
    name: Yanbo Zhou
    jobTitle: Ph.D. Student in Computer Science
    affiliation: University of California, San Diego
    lab: Non-Volatile Systems Lab (NVSL)
    email: yaz093@ucsd.edu
    image: /my3.jpg
    sameAs:
      - https://www.linkedin.com/in/yanbo-zhou-b37632291/
      - https://scholar.google.com/citations?hl=en&user=T5KZshEAAAAJ
  utterances:
    repo:               # Set to Utterances repo URL to add Utterances comments
    issueterm: pathname
    theme: github-light
  netlify:
    honeypot: false     # Set to true to add honeypot field in contact form
    recaptcha: false    # Set to true to add recaptcha challenge in contact form
  css:
    - custom.css
  # js:                 # Uncomment to add custom JS from a list of files
  #   - js/foo.js
  #   - bar.js

menu:
  nav:
    - name: Home
      url: "/"
      weight: 1
    - name: Publications
      url: "/publications/"
      weight: 1
    - name: Talks
      url: "/talks/"
      weight: 2
    - name: Others
      url: "/others/"
      weight: 3
